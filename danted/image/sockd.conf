# 照搬上游 docker-1.4.2/conf/sockd.conf, 只把 internal 改成 0.0.0.0;
# 容器跑 host 网络, entrypoint.sh 启动时会按 PORT 和默认路由网卡改写 internal 端口和 external
logoutput: stdout
#debug: 2

internal: 0.0.0.0   port = 2020
external: eth0
#external.rotation: same-same

clientmethod: none
socksmethod: pam.username none

user.privileged: root
user.notprivileged: nobody

client pass {
    from: 0/0  to: 0/0
    log: connect disconnect
}
client block {
    from: 0/0 to: 0/0
    log: connect error
}

socks pass {
    from: 0/0 to: 0/0
    socksmethod: pam.username
    log: connect disconnect
}
socks block {
    from: 0/0 to: 0/0
    log: connect error
}
